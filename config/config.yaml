# Prism Default Configuration
#
# This file contains all default values. To override:
# - Place a custom prism.yaml at ~/.config/prism/prism.yaml
# - Set environment variables: PRISM_<SECTION>_<KEY> (e.g., PRISM_SERVER_PORT)
#
# Loading order: env vars > prism.yaml > config.yaml (this file)

server:
  port: 8765
  transport: streamable-http
  log_level: INFO

search:
  max_query_length: 10000

errors:
  # Failure reasons are parsed out of the CLI's own output and stored on the
  # session, so a stack trace or a full model response can end up here. Cap it.
  max_message_chars: 500

levels:
  0:
    worker_timeout_seconds: 80
    worker_visible_timeout: 30
    # Used by resume-chat, which runs a manager turn without dispatching workers.
    manager_timeout_seconds: 120
  1:
    # Hard kill budget per worker. Keep well above the visible budget: agents
    # routinely overshoot the budget they are told, and a hard cap sitting on
    # the success-time distribution clips otherwise-healthy runs.
    worker_timeout_seconds: 200
    worker_visible_timeout: 80
    # Budget for the manager's own turns (planning, synthesis, resume).
    manager_timeout_seconds: 120
    agent_allocation:
      claude_search: 1
      gemini_search: 1
      tavily_search: 1
      perplexity_search: 1
  2:
    worker_timeout_seconds: 230
    worker_visible_timeout: 120
    manager_timeout_seconds: 240
    agent_allocation:
      claude_search: 2
      gemini_search: 2
      tavily_search: 1
      perplexity_search: 1
  3:
    worker_timeout_seconds: 600
    worker_visible_timeout: 480
    manager_timeout_seconds: 300
    agent_allocation:
      claude_search: 3
      gemini_search: 2
      tavily_search: 2
      perplexity_search: 1

models:
  # Model the Claude CLI falls back to when the primary one is overloaded or
  # rate limited. Aliases resolve to the newest model the installed CLI knows,
  # so freshness is pinned by the CLI version in docker/Dockerfile, not here.
  fallback: sonnet
  session_manager:
    # Level 0 is the resume-chat manager: it discusses stored results and never
    # dispatches workers, so it does not need the planning tier's model.
    0:
      model: sonnet
      effort: low
    1:
      model: opus
      effort: low
    2:
      model: opus
      effort: low
    3:
      model: opus
  claude_workers:
    0:
      model: haiku
    1:
      model: opus
      effort: low
    2:
      model: opus
      effort: low
    3:
      model: opus
  gemini_workers:
    # Rolling aliases: Google points these at the newest flash/pro release, so
    # a deprecated generation never strands a worker. Pin a concrete id here
    # only to reproduce a specific model's behaviour.
    0:
      model: gemini-flash-latest
    1:
      model: gemini-flash-latest
    2:
      model: gemini-pro-latest
    3:
      model: gemini-pro-latest

level0:
  default_providers:
    - claude_search

retry:
  max_transient_retries: 3
  base_delay_seconds: 1.0
  max_delay_seconds: 8.0
  exponential_base: 2.0
  max_validation_retries: 5

process:
  sigterm_timeout_seconds: 2.0
  sigkill_timeout_seconds: 5.0

database:
  url: postgresql+asyncpg://prism:prism@localhost:5432/prism
  pool_size: 20
  max_overflow: 10

retention:
  session_ttl_days: 30
